---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Root directory was created with correct permissions
      ansible.builtin.stat:
        path: "/opt/testapp/"
      register: dir_stat
    - name: Assert directory state
      ansible.builtin.assert:
        that:
          - dir_stat.stat.exists
          - dir_stat.stat.isdir
          - dir_stat.stat.mode == '0750'

    - name: Timer units were created
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}"
      loop:
        - testapp-timer.service
        - testapp-timer.timer
      register: timer_units

    - name: Assert timer units state
      ansible.builtin.assert:
        that:
          - timer_units.results | map(attribute='stat.exists') | select('equalto', false) | list | length == 0

    - name: Gather timer unit state
      ansible.builtin.systemd:
        name: testapp-timer.timer
      register: timer_unit

    - name: Assert timer is enabled and active
      ansible.builtin.assert:
        that:
          - timer_unit.status.ActiveState == 'active'
          - timer_unit.status.UnitFileState == 'enabled'

    - name: Container routes were added after start
      block:
        - name: Gather the testapp container state
          community.docker.docker_container_info:
            name: testapp
          register: testapp_container

        - name: Read the routes of the testapp container
          ansible.builtin.command: nsenter --net={{ testapp_container.container.NetworkSettings.SandboxKey }} ip -json route show 192.0.2.0/24
          register: testapp_routes
          changed_when: false

        - name: Assert the container route
          ansible.builtin.assert:
            that:
              - testapp_routes.stdout | from_json | map(attribute='gateway') | list == ['172.18.0.1']
